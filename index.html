<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Interstellar RPG</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        transition: opacity 250ms ease;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Game view"></canvas>
    <div id="fade" aria-hidden="true"></div>
    <div id="hud" aria-live="polite"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
