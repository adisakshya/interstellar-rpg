<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SPIKE-001</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        font-size: 14px;
        text-shadow: 0 0 3px #000;
        pointer-events: none;
      }
      #pad {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid #fff8;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Spike scene"></canvas>
    <div id="hud" aria-live="polite">loading…</div>
    <div id="pad" aria-label="Move"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
