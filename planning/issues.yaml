  - key: TIME-002
    title: Decision barriers block dependent events until resolved
    type: feature
    area: timeline
    priority: P0
    milestone: M1
    epic: EPIC-M1
    agent: claude-code  # taken over 2026-11-15: Codex had no environment for this repo
    status: done
    size: M
    review_effort: 1h
    requirements: [C-06, D-10, FR-04]
    depends_on: [TIME-001]
    blockers: []
    rationale: Uncontrolled expeditions advance to decision points and wait (C-06).
    scope: [PendingDecision entity, soft/hard barrier policy per TIMELINES.md §3 (D-10), Interrupted and Blocked result types, early resolution of forecast decisions, resolve command]
    exclusions: [Dialogue UI]
    interfaces: [ResolveDecision command, DecisionPending/DecisionResolved events]
    acceptance:
      - An interruptible activity that reaches an unresolved hard deadline commits up to that deadline as ActivityInterrupted (progress kept) and returns Interrupted; T stops at the deadline (INV-06)
      - An atomic activity whose span contains an unresolved hard deadline returns Blocked and commits nothing (INV-05)
      - Early ResolveDecision of a forecast decision commits DecisionPending, then CheckpointCreated if flagged, then DecisionResolved
      - Soft decisions block only dependent events (INV-07); resolution unblocks exactly those events
      - Walkthrough 3 (both the interruptible and the atomic variant) passes as a test
    validation: Unit tests from INV-xx.

