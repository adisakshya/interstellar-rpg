    rationale: M1 implementation must start from an approved, consistent baseline.
    scope: [docs/ROADMAP.md, docs/TRACEABILITY.md, update issues.yaml + GitHub issues with FR/NFR IDs and contract links, flip readiness labels]
    exclusions: [Detailed M2+ tickets]
    interfaces: []
    acceptance: [No dependency cycles; every M1 issue references contract sections; creator approval recorded in DECISIONS.md]
    validation: Creator sign-off.

