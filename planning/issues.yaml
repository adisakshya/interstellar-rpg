    exclusions: [Dialogue UI]
    interfaces: [ResolveDecision command, DecisionPending/DecisionResolved events]
    acceptance: [Advancing past a barrier returns Blocked with no partial commit; resolution unblocks exactly dependent events; walkthrough 3 passes as a test]
    validation: Unit tests from INV-xx.

