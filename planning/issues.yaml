  - key: TIME-001
    title: Per-character clocks advance once per committed simulation step
    type: feature
    area: timeline
    priority: P0
    milestone: M1
    epic: EPIC-M1
    agent: codex
    status: blocked
    size: M
    review_effort: 1h
    requirements: [C-05, C-08, C-11]
    depends_on: [DOM-001, DOCS-001, DOCS-002]
    blockers: []
    rationale: Core mechanic - local time on Miller costs time elsewhere.
    scope: [Reference + proper-time clocks per character, ratio lookup from DOCS-002 fixture, synthetic test ratio labelled test-only]
    exclusions: [GR solver, UI]
    interfaces: [AdvanceTime command, ClockAdvanced event]
    acceptance:
      - With a synthetic 10x fixture, advancing Cooper 60 s advances Romilly/reference 600 s.
      - Duplicate command ID does not double-advance.
      - Switch command changes controlled character only; clocks unchanged.
    validation: Independent expected-value fixtures (not formula copies).

  - key: TIME-002
