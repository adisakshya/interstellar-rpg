# Backlog source of truth. GitHub numbers live in planning/github-map.json.
# Statuses: draft | blocked | ready | in-progress | review | done
#   ready   = dependencies merged AND no open product decision blocks it.
#   blocked = waiting on a dependency or a creator decision (named in blockers/depends_on).
# Requirement IDs: C-xx (brief §2), D-xx (DECISIONS.md). FR/NFR IDs are assigned by DOCS-005 and back-filled.
# Size heuristic: S <= 0.5 day, M <= 1 day, L <= 2 days human-equivalent. Review = creator hours.
plan_version: 0.1.0
repository: adisakshya/interstellar-rpg

epics:
  - key: EPIC-M0
    title: "M0 — Design and feasibility decisions"
    outcome: Approved episode boundary, timeline rules, device targets, architecture, and an executable M1 backlog.
    exit: [Approved compact docs (TIMELINES, PHYSICS, ARCHITECTURE+ADRs, VISION/GDD, PRD/VALIDATION, co-op policy), Babylon mobile spike result, all M1 issues ready or explicitly blocked]
    depends_on: [creator review]
  - key: EPIC-M1
    title: "M1 — End-to-end prototype (Cooper + Romilly)"
    outcome: Placeholder Cooper (Miller surface) and Romilly (Endurance orbit); cockpit-to-surface transition; one shared time consequence; switching; touch; save/load.
    exit: [Playable Pages build, timeline invariant tests green, desktop + mobile measurements, one recorded creator playthrough]
    depends_on: [EPIC-M0]
  - key: EPIC-M2
    title: "M2 — Miller's planet episode"
    outcome: Scientific problem, mission trade-offs, dialogue/relationship consequences, Brand + Murph playable, alternative outcome, adaptive audio, progression per D-03.
    exit: [Complete episode, two outcome playtests, asset inventory, understandable time feedback]
    depends_on: [EPIC-M1 validated]
  - key: EPIC-M3
    title: "M3 — Single-player public release candidate"
    outcome: Reliable, accessible episode ready for public play on GitHub Pages.
    exit: [Device/browser matrix results, performance evidence, save compatibility, Pages deployment check, content completeness]
    depends_on: [EPIC-M2]
  - key: EPIC-M4
    title: "M4 — Campaign expansion"
    outcome: Further characters, scenes, spacecraft operations, and outcomes in bounded episodes.
    exit: [Each episode passes regression and playtest gates without breaking established history]
    depends_on: [EPIC-M3, prioritisation review]
  - key: EPIC-M5
    title: "M5 — Live co-op"
    outcome: Friends own different characters in one authoritative shared campaign.
    exit: [Agreed player count, infrastructure decision, ownership/waiting policy, measured two-client consistency, reconnect and failure recovery]
    depends_on: [EPIC-M3, networking feasibility spike]

issues:
  # ---------------- M0: planning (Claude Code) ----------------
  - key: DOCS-001
    title: Define timeline, switching, and causality contract (docs/TIMELINES.md)
    type: docs
    area: timeline
    priority: P0
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: ready
    size: L
    review_effort: 2h
    requirements: [C-04, C-05, C-06, C-11, P-04, P-05]
    depends_on: []
    blockers: [Save slots / death-checkpoint policy, whether real-world absence advances simulation — ask via pop-up while drafting]
    rationale: Free switching without explicit causality rules allows contradictory state, knowledge leaks, and cost evasion. Every M1 domain issue implements this contract.
    scope:
      - Define real elapsed time, reference/simulation time, per-character proper time, and narrative event order.
      - Committed event history, bounded automatic actions for uncontrolled characters, decision barriers (block-dependent vs block-all, with worked example).
      - Availability states (dead, incapacitated, unreachable, occupied, future-blocked) and UI reason codes.
      - Per-character knowledge vs player-seen facts; in-world message delivery delays.
      - Unattended resource consumption, task duration, death, checkpoints, browser suspension, save/reload.
      - Separate single-player and draft co-op waiting policies.
      - Required walkthroughs 1–5 and 7 from brief §8.
    exclusions: [Code, physics derivations (DOCS-002), UI design]
    interfaces: [Command/event names and invariants consumed by DOM-001, TIME-001..004, RES-001, SAVE-001]
    acceptance:
      - Each walkthrough has a step-by-step state table with expected clock/resource/knowledge values.
      - Invariants are numbered (INV-xx) and testable.
      - Open questions are asked through pop-ups and recorded in DECISIONS.md.
    validation: Creator review; Codex-agnostic reading test (another agent can derive test cases from INV-xx alone).

  - key: DOCS-002
    title: Validate Miller's planet time-dilation model and physics inventory (docs/PHYSICS.md)
    type: docs
    area: physics
    priority: P0
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: ready
    size: M
    review_effort: 1.5h
    requirements: [C-02, C-11]
    depends_on: []
    blockers: []
    rationale: "The ~1 hour : 7 years ratio (~61,000x) requires a near-extremal Kerr black hole and a specific orbit; the old draft's Schwarzschild claim lacks observer/orbit conditions."
    scope:
      - Model inventory classified as established / approximation / speculative / fictional (incl. Miller's waves, wormhole).
      - Equations, units, frames, valid domains for the orbit/surface time ratio; cite primary sources (Thorne, The Science of Interstellar; James et al. 2015).
      - Independent numeric reference fixtures with tolerances; game ratio must be labelled derived or tuned.
      - Precomputed-table vs runtime decision; control assists list.
    exclusions: [Black-hole renderer, flight dynamics implementation]
    interfaces: [Ratio table/fixture format consumed by TIME-001]
    acceptance:
      - Every physical claim has a source, applicability note, and date checked.
      - Old draft's unsupported claims are listed and resolved or flagged.
      - Fixture file values are reproducible from documented equations.
    validation: Creator review; recomputation of fixtures by a second method.

  - key: DOCS-003
    title: Architecture and ADRs for Babylon.js + TS + Vite client (docs/ARCHITECTURE.md, docs/adr/)
    type: docs
    area: architecture
    priority: P0
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: ready
    size: L
    review_effort: 1.5h
    requirements: [C-09, C-10, C-13, D-04]
    depends_on: []
    blockers: []
    rationale: Domain/presentation separation must exist from M1 so co-op authority (M5) is an adapter, not a rewrite.
    scope:
      - Component boundaries; domain layer is pure TS with no Babylon imports.
      - Command -> validate -> event -> state interfaces; stable entity IDs; idempotent command IDs.
      - Content schema approach (JSON + runtime validation), save snapshot + bounded event history.
      - Input adapters (keyboard/mouse, touch), quality tiers, lifecycle handling, Pages subpath build.
      - ADR-001 stack, ADR-002 domain/command model, ADR-003 save format, ADR-004 future authority model.
    exclusions: [Engine bake-off, networking implementation, ray marching/floating origin unless measured need]
    interfaces: [TypeScript interface sketches for GameState, Command, DomainEvent, SaveFile]
    acceptance:
      - ADRs state context, decision, consequences, and status (provisional until SPIKE-001).
      - Directory layout and module dependency rules are explicit enough for Codex to scaffold.
    validation: Creator review; consistency check against DOCS-001 invariants.

  - key: DOCS-004
    title: Vision and GDD for Miller's planet episode (docs/VISION.md, docs/GDD.md)
    type: docs
    area: narrative
    priority: P0
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: ready
    size: L
    review_effort: 2h
    requirements: [C-01, C-02, C-07, C-08, D-01, D-02, D-03, P-01, P-02]
    depends_on: []
    blockers: [Creative review of beat sheet before expanding dialogue]
    rationale: Content and progression issues cannot be written without an approved beat sheet and progression model.
    scope:
      - Target player, emotional objective, four pillars, full-product vs episode boundary.
      - Beat sheet: Cooper (surface) + Romilly (orbit) for M1; Brand (surface) and Murph (Earth) additions for M2.
      - Core loop, player verbs, one scientific problem, one relationship decision, one resource trade-off, two outcomes.
      - Progression model covering relationships/trust, knowledge/evidence, skills, equipment/resources (D-03) with staging proposal.
      - Death/checkpoint behaviour; content-volume estimate.
    exclusions: [Final dialogue script, voiceover, full film recreation]
    interfaces: [Content IDs (characters, locations, decisions, facts) consumed by CONT-001]
    acceptance:
      - Each beat names the controlling character, decision, clock impact, and persistent consequence.
      - Two outcomes differ in game-domain state, not only text.
      - Staging of progression types is marked Proposed for creator approval.
    validation: Creator reads the beat sheet and can explain the time/resource trade-off.

  - key: DOCS-005
    title: PRD, validation plan, device matrix, and budgets (docs/PRD.md, docs/VALIDATION.md)
    type: docs
    area: qa
    priority: P1
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: blocked
    size: M
    review_effort: 1h
    requirements: [C-10, C-12, C-13, P-03]
    depends_on: [DOCS-001, DOCS-004]
    blockers: [Creator nominates reference phone(s), desktop, browser versions]
    rationale: Performance claims need named devices and measurement conditions.
    scope:
      - Stable FR/NFR IDs with priority, milestone, acceptance criteria, C-ID traceability, exclusions.
      - Device/browser matrix, frame-time percentiles, cold-cache and network profile.
      - Manual playtest protocol, accessibility checks, release evidence list.
    exclusions: [Analytics, monetisation]
    interfaces: [FR/NFR IDs back-filled into planning/issues.yaml]
    acceptance:
      - Every M1 issue maps to at least one FR/NFR.
      - Budgets reference named devices and measurement method.
    validation: Creator review.

  - key: SETUP-001
    title: Scaffold Vite + TypeScript + Babylon.js project with lint, typecheck, unit tests, and CI
    type: chore
    area: build
    priority: P0
    milestone: M1
    epic: EPIC-M1
    agent: codex
    status: ready
    size: M
    review_effort: 0.5h
    requirements: [D-04, C-13]
    depends_on: []
    blockers: []
    rationale: Stack is confirmed (D-04); every implementation issue needs a working toolchain.
    scope:
      - Vite + strict TypeScript, @babylonjs/core (ES modules, tree-shakeable imports), Vitest, ESLint + Prettier.
      - Folders src/domain (no Babylon imports, enforced by lint rule), src/render, src/input, src/ui, src/content.
      - Base path configurable for GitHub Pages subpath (/interstellar-rpg/).
      - GitHub Actions CI on PR: install, lint, typecheck, test, build.
      - Placeholder scene rendering a single mesh.
    exclusions: [Deployment (CI-001), game logic]
    interfaces: [npm scripts dev/build/test/lint/typecheck]
    acceptance:
      - npm ci && npm run lint && npm run typecheck && npm test && npm run build pass locally and in CI.
      - Importing @babylonjs/* from src/domain fails lint.
      - README documents commands.
    validation: CI run link; screenshot of placeholder scene.

  - key: DOCS-006
    title: Draft co-op authority and ownership policy (docs/COOP_POLICY.md)
    type: docs
    area: multiplayer
    priority: P2
    milestone: M0
    epic: EPIC-M0
    agent: claude-code
    status: blocked
    size: M
    review_effort: 1h
    requirements: [C-04, C-05, C-06]
    depends_on: [DOCS-001, DOCS-003]
    blockers: [Creator decides co-op player count and host/authority preference]
    rationale: Single-player pause rules do not automatically become fair multiplayer rules; constraints must enter M0 even though networking is M5.
    scope: [Session authority, character ownership, simultaneous inputs, shared choices, waiting at barriers, join/leave, reconnect, save ownership, walkthrough 7]
    exclusions: [Networking code, infrastructure selection]
    interfaces: [Constraints that DOM-001 must not violate]
    acceptance: [Walkthrough 7 resolved with expected behaviour; listed constraints are referenced in ARCHITECTURE.md]
    validation: Creator review.

  - key: SPIKE-001
    title: "Spike: Babylon.js mobile feasibility — bundle size, FPS, and touch on reference devices"
    type: spike
    area: performance
    priority: P0
    milestone: M0
    epic: EPIC-M0
    agent: codex
    status: blocked
    size: M
    review_effort: 1h
    requirements: [C-09, C-10, P-03]
    depends_on: [SETUP-001]
    blockers: [Reference phone nominated (or emulator-only result accepted as provisional)]
    rationale: Budgets (P-03) are unmeasured targets; ADR-001 stays provisional until measured.
    scope:
      - Time box 1.5 days. Question - can a small terrain + water plane + capsule character + cockpit interior hit P-03 budgets?
      - Measure compressed initial transfer, p50/p95 frame time on desktop and phone, memory, touch joystick latency.
      - Compare tree-shaken @babylonjs/core vs full build size.
    exclusions: [Production assets, shaders beyond defaults]
    interfaces: [Report docs/spikes/SPIKE-001.md]
    acceptance: [Report with raw numbers, device names, conditions, and recommendation; emulator vs physical results distinguished]
    validation: Creator reproduces the build on their phone.

  - key: DOCS-007
    title: M0 gate — roadmap, traceability, and promote M1 issues to ready
    type: docs
